name: Question bank

# The live-model regression. Slow, needs a model endpoint and the visits file, so
# it runs on request or on a schedule rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bank:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install -e . pytest
      - name: Run the bank
        env:
          USE_LLM: "1"
        run: pytest tests/test_question_bank.py -q
