name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff pytest
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Test
        # The live-model bank is skipped here by design: it needs a model endpoint
        # and several minutes. It runs in question-bank.yml instead.
        run: pytest -q
      - name: Readiness check reports not-ready without a model
        # A failing check must fail loudly rather than silently pass.
        run: |
          if python -m smart_data_studio.healthcheck; then
            echo "expected not-ready without an Ollama endpoint" && exit 1
          fi

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t smart-data-studio:ci .
      - name: It starts and serves
        run: |
          docker run -d --name sds -p 8501:8501 smart-data-studio:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "serving" && exit 0
            fi
            sleep 2
          done
          echo "did not come up" && docker logs sds && exit 1
      - name: Stop
        if: always()
        run: docker rm -f sds || true
