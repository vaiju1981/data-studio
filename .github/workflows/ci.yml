name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install from the lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip install ruff pytest pip-audit cyclonedx-bom

      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests

      - name: Test
        # The live-model bank is skipped here by design — it needs a model endpoint
        # and several minutes. question-bank.yml runs it instead.
        run: pytest -q --junitxml=results.xml

      - name: The fast suite must not go quiet
        # A count would need bumping whenever the bank grows; what matters is that
        # nothing outside the opt-in suite is silently skipping.
        run: python tools/check_skips.py results.xml

      - name: Readiness check reports not-ready without a model
        # A health check that cannot fail is not a health check.
        run: |
          if python -m smart_data_studio.healthcheck; then
            echo "expected not-ready without an Ollama endpoint" && exit 1
          fi

      - name: Audit dependencies
        run: pip-audit -r requirements.lock --strict

      - name: Software bill of materials
        run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t smart-data-studio:ci .

      - name: It starts, serves and runs as a non-root user
        run: |
          docker run -d --name sds -p 8501:8501 \
            --read-only --tmpfs /tmp -v sds-work:/workspace smart-data-studio:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health >/dev/null; then
              test "$(docker exec sds id -u)" != "0" || { echo "running as root"; exit 1; }
              echo "serving as uid $(docker exec sds id -u)"; exit 0
            fi
            sleep 2
          done
          echo "did not come up"; docker logs sds; exit 1

      - name: Scan the image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: smart-data-studio:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Stop
        if: always()
        run: docker rm -f sds || true
