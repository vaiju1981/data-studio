version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # CI runs the full suite on the PR, so an update that breaks an analysis
    # cannot merge on a green version bump alone.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    # Patch and security rebuilds of the 3.10 image, never a move off it. The
    # development environment is Python 3.10 and the lockfile is resolved against
    # it, so a bump to 3.14 is a pull request that cannot pass and has to be
    # closed by hand each month — which is how a red check stops being read.
    # Moving Python version is a decision, not a dependency update.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
