[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-data-studio"
version = "0.1.0"
description = "Local CSV profiling and conversational analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.5",
  # Ollama's own transport. Named here because the retry catches its timeout.
  "httpx>=0.27",
  "ollama>=0.6,<1",
  "pandas>=2.3",
  "plotly>=5.24",
  "scipy>=1.15",
  "sqlglot>=30",
  "statsmodels>=0.14",
  "streamlit>=1.61",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The bank is a corpus of questions to paste and read, not prose to wrap.
"tests/test_question_bank.py" = ["E501"]
